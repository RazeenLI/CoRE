[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "core-rdb-maintenance"
version = "0.1.0"
description = "AI-assisted maintenance of relational databases with incoming tables"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "accelerate>=1.0,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.11,<2",
  "sentence-transformers>=2.7,<6",
  "torch>=2.2,<3",
  "transformers>=5.0,<6",
]

[project.optional-dependencies]
traditional = ["valentine>=1.0.0,<2"]
visualization = ["matplotlib>=3.8,<4"]
test = ["pytest>=8,<10"]
all = [
  "matplotlib>=3.8,<4",
  "pytest>=8,<10",
  "valentine>=1.0.0,<2",
]

[tool.setuptools.packages.find]
include = ["baselines*", "evaluation*", "experiments*", "model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
