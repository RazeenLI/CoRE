LLMs:
  name: "deepseek-ai/DeepSeek-Coder-V2-Lite-Instruct"
  default_mode: "non_thinking"
  # Transformers 5.x supports DeepSeek-V2 natively. Avoid the checkpoint's
  # legacy modeling_deepseek.py, which imports removed Transformers helpers.
  trust_remote_code: false

orchestrator:
  high_confidence_threshold: 0.9
  max_validator_runs: 3
  decision_auto: true

standard:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  column_top_k: 20
  table_top_k: 5
