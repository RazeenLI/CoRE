LLMs:
  name: "Qwen/Qwen3.5-9B"
  default_mode: "non_thinking"

orchestrator:
  high_confidence_threshold: 0.9
  max_validator_runs: 3
  decision_auto: True

standard:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  column_top_k: 20
  table_top_k: 5

# Experimental Standard variant with compact row-grain profiles.
grain_profiler:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  column_top_k: 20
  table_top_k: 5

# Standard variant that filters constraints to the Top-k table subgraph.
constraint_filter:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  column_top_k: 20
  table_top_k: 5

# Magneto-style baseline: retrieve/rerank schemas, then apply fixed rules.
magneto:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  retrieval_top_k: 20
  column_match_confidence: 0.65
  insert_table_confidence: 0.80
  insert_coverage: 1.00
  extend_table_confidence: 0.45

# SLM-based high-recall context selector used before the experimental Evolutor.
selector:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  column_top_k: 20
  table_top_k: 5

# Selector ablation with the same retrieval settings but no incoming Profiler.
no_profiler:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  column_top_k: 20
  table_top_k: 5

# Shared operation rules for the non-learned Valentine baselines.
traditional:
  column_match_confidence: 0.70
  insert_table_confidence: 0.70
  insert_coverage: 1.00
  extend_table_confidence: 0.35

jl:
  assignment_threshold: 0.70
  levenshtein_threshold: 0.80

coma:
  assignment_threshold: 0.70
  use_schema: true
  use_instances: true
  delta: 0.15

# Shared proposal rules for adapted dataset-discovery baselines.
discovery_rules:
  column_match_confidence: 0.20
  insert_table_confidence: 0.45
  insert_coverage: 1.00
  extend_table_confidence: 0.15

# SANTOS synthesized-KB adaptation. All indexes are rebuilt per case.
santos:
  assignment_threshold: 0.20
  relationship_weight: 0.25

# EmbDI adaptation. Graph construction and Skip-gram training run per case.
embdi:
  assignment_threshold: 0.55
  column_match_confidence: 0.55
  insert_table_confidence: 0.55
  extend_table_confidence: 0.25
  dimensions: 100
  walk_length: 20
  walks_per_node: 10
  window_size: 3
  epochs: 5
  negative_samples: 5
  learning_rate: 0.025
  batch_size: 2048
  max_training_pairs: 200000
  seed: 0
  device: cuda

# Starmie uses one frozen checkpoint trained externally on VizNet. Paths are
# supplied through STARMIE_ROOT and STARMIE_CHECKPOINT rather than committed.
starmie:
  assignment_threshold: 0.70
  column_match_confidence: 0.70
  insert_table_confidence: 0.70
  extend_table_confidence: 0.35
  batch_size: 128
  device: cuda
