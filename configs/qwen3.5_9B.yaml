LLMs:
  name: "Qwen/Qwen3.5-9B"
  default_mode: "non_thinking"

orchestrator:
  high_confidence_threshold: 0.9
  max_validator_runs: 3
  decision_auto: True

# Magneto-style baseline: retrieve/rerank schemas, then apply fixed rules.
magneto:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  retrieval_top_k: 20
  column_match_confidence: 0.65
  insert_table_confidence: 0.80
  insert_coverage: 1.00
  extend_table_confidence: 0.45

# SLM-based high-recall context selector used before the experimental Evolutor.
selector:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  column_top_k: 20
  table_top_k: 5

# Selector ablation with the same retrieval settings but no incoming Profiler.
selector_no_profiler:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  column_top_k: 20
  table_top_k: 5

# Shared operation rules for the non-learned Valentine baselines.
traditional:
  column_match_confidence: 0.70
  insert_table_confidence: 0.70
  insert_coverage: 1.00
  extend_table_confidence: 0.35

jl:
  assignment_threshold: 0.70
  levenshtein_threshold: 0.80

coma:
  assignment_threshold: 0.70
  use_schema: true
  use_instances: true
  delta: 0.15
