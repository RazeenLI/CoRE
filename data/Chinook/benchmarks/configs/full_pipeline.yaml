info:
  seed: 42
  source_dir: data/Chinook/parsed
  output_dir: data/Chinook/benchmarks/full_pipeline

expected_rdb:
  row_policy:
    mode: first_n
    n: 10
  tables: []

steps:
  - name: step_001_customer_profile
    operation: remove_columns
    source_table: customer
    incoming_table: customer_profile
    incoming_columns: "*"
    incoming_row_policy:
      mode: ratio
      ratio: 1.0
    delate_columns:
      - company
      - address
      - city
      - state
      - country
      - postal_code
      - phone
      - fax
      - email
    keys:
      - customer_id

  - name: step_002_employee_profile
    operation: remove_columns
    source_table: employee
    incoming_table: employee_profile
    incoming_columns: "*"
    incoming_row_policy:
      mode: ratio
      ratio: 1.0
    delate_columns:
      - title
      - reports_to
      - birth_date
      - hire_date
      - address
      - city
      - state
      - country
      - postal_code
      - phone
      - fax
      - email
    keys:
      - employee_id

  - name: step_003_artist
