info:
  seed: 42
  source_dir: data/Chinook/parsed
  output_dir: data/Chinook/benchmarks/small_case_A_remove_columns

expected_rdb:
  row_policy:
    mode: first_n
    n: 10
  tables:
    customer: []
    invoice: []

steps:
  - name: step_001_customer_profile
    operation: remove_columns
    source_table: customer
    incoming_table: customer_profile
    incoming_columns: "*"
    incoming_row_policy:
      mode: ratio
      ratio: 1.0
    delete_columns:
      - email
      - country
    keys:
      - customer_id